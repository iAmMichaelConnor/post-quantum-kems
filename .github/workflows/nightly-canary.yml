name: Noir Nightly Canary

on:
  schedule:
    # Run a check at 9 AM UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The slow mode uses the latest release, not nightly, so that a compiler regression and a library regression are
  # reported apart.
  SLOW_MODE_NOIR_VERSION: 1.0.0

jobs:
  # The pull-request tests (test.yml) on Noir nightly.
  test:
    name: Test ${{ matrix.package }} on Nargo nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        package: [fips202, lattice_kem_core, ml_kem, kyber]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: nightly

      - name: Run tests
        run: nargo test --force-brillig --inliner-aggressiveness 0 --package ${{ matrix.package }} --test-threads 4

      - name: Open an issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEMPLATE: .github/NIGHTLY_CANARY_DIED.md
        # The template's title and body; an open issue with that title is updated instead of opening another.
        run: |
          TITLE=$(sed -n 's/^title: "\(.*\)"$/\1/p' "$TEMPLATE")
          export TITLE
          body=$(awk 'n >= 2; /^---$/ { n++ }' "$TEMPLATE")
          body=${body//'{{env.WORKFLOW_NAME}}'/"$WORKFLOW_NAME"}
          body=${body//'{{env.WORKFLOW_URL}}'/"$WORKFLOW_URL"}
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  # Every package constrained, one job per package, with the thread count and timeout CONTRIBUTING.md#tests gives.
  slow-mode:
    name: Slow mode (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: fips202, threads: 4, timeout: 30 }
          - { package: lattice_kem_core, threads: 4, timeout: 30 }
          - { package: ml_kem, threads: 4, timeout: 120 }
          - { package: kyber, threads: 4, timeout: 30 }
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.SLOW_MODE_NOIR_VERSION }}

      - name: Run tests constrained
        run: nargo test --package ${{ matrix.package }} --test-threads ${{ matrix.threads }}

      - name: Open an issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEMPLATE: .github/SLOW_MODE_FAILED.md
        # The template's title and body; an open issue with that title is updated instead of opening another.
        run: |
          TITLE=$(sed -n 's/^title: "\(.*\)"$/\1/p' "$TEMPLATE")
          export TITLE
          body=$(awk 'n >= 2; /^---$/ { n++ }' "$TEMPLATE")
          body=${body//'{{env.WORKFLOW_NAME}}'/"$WORKFLOW_NAME"}
          body=${body//'{{env.WORKFLOW_URL}}'/"$WORKFLOW_URL"}
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
